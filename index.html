<!doctype html>
<html lang="fi">
<head>

<title>Lähiön Aarre</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--ink:#201a15;--paper:#f3dfaa;--paper2:#fff3ce;--gold:#efc434;--red:#c92b31;--blue:#2568c8;--green:#318653;--shadow:#0007}
*{box-sizing:border-box}html,body{margin:0;background:#211d18;color:var(--ink);font-family:Georgia,serif;min-height:100%}button,input,select{font:inherit}
.app{max-width:1180px;margin:auto}.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(#f4e5b8,#d9be79);border-bottom:3px solid #17130f}.logo{font-size:clamp(25px,7vw,42px);font-weight:900}.tag{font-size:11px;font-style:italic}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:8px;padding:8px}@media(max-width:820px){.grid{grid-template-columns:1fr;padding:0}.side{order:-1}.desktop{display:none}}
.side{background:linear-gradient(#f7ebc5,#d7bb79);border:3px solid #17130f;padding:8px}.panel{background:#fff7d7df;border:2px solid #796441;padding:8px;margin-bottom:7px}.turn{font-size:23px;font-weight:900}.status{font:13px Arial;min-height:32px}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}button{border:2px solid #17130f;border-radius:7px;padding:9px 10px;background:#f2ce50;font-weight:800;box-shadow:0 2px 0 #63502f;cursor:pointer}button:disabled{opacity:.4}.blue{background:#b9d8ff}.green{background:#bde1b5}.red{background:#e8a29a}.dice{width:52px;height:52px;display:grid;place-items:center;background:#fff;border:3px solid #17130f;border-radius:10px;font-size:29px;font-weight:900;margin:6px 0}.players{display:grid;gap:5px}.player{display:grid;grid-template-columns:13px 1fr auto;gap:7px;padding:6px;background:#fff9e7;border:1px solid #87734f;font:12px Arial}.player.now{outline:3px solid var(--gold)}.dot{width:13px;height:13px;border-radius:50%;border:2px solid #111}.badge{display:inline-block;border:1px solid #8b7347;background:#fff1aa;border-radius:10px;padding:1px 5px;margin-top:2px}.board{position:relative;aspect-ratio:10/14.2;overflow:hidden;border:3px solid #17130f;background:linear-gradient(155deg,#749766 0 21%,#b9c798 21% 42%,#d7c07a 42% 62%,#8ca26f 62%);box-shadow:0 8px 25px #0008}.board:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 17% 23%,#6d8e5b 0 8%,transparent 8.3%),radial-gradient(circle at 82% 15%,#426d48 0 14%,transparent 14.4%),radial-gradient(circle at 76% 70%,#768b5b 0 12%,transparent 12.4%),linear-gradient(22deg,transparent 0 47%,#c5d4d8 47% 50%,transparent 50% 100%);opacity:.8}.mapTitle{position:absolute;z-index:2;left:5%;top:2%;padding:5px 12px;background:#f3dfa6e8;border:2px solid #2a2118;font-size:clamp(18px,4vw,35px);font-weight:900;transform:rotate(-2deg)}svg{position:absolute;inset:0;width:100%;height:100%;z-index:3}.road{stroke:#4f4335;stroke-width:7;stroke-linecap:round;opacity:.78}.road.bus{stroke:#1d64bd;stroke-dasharray:18 12}.node circle{fill:#fff4d6;stroke:#30271e;stroke-width:4}.node.stash circle{fill:#cf3034;stroke:#fff;stroke-width:4}.node.bus circle{fill:#dbeaff;stroke:#1859a6;stroke-width:5}.node.home circle{stroke-width:8}.node.goal circle{fill:#f3c83e;stroke:#5d4100;stroke-width:6}.node.legal circle{fill:#fff26b;filter:drop-shadow(0 0 13px #fff);animation:pulse .65s infinite alternate}.node.legal{cursor:pointer}@keyframes pulse{to{transform:scale(1.1);transform-origin:center}}.label{font:800 22px Arial;paint-order:stroke;stroke:#f8edc8;stroke-width:8px;stroke-linejoin:round;fill:#19130e}.minor{font-size:17px}.pawn{stroke:#fff;stroke-width:5;filter:drop-shadow(0 3px 2px #0008)}.pawn.now{stroke:#ffe153;stroke-width:9}.stashQ{font:900 18px Arial;fill:#fff;text-anchor:middle;dominant-baseline:middle}.modalWrap{position:fixed;z-index:100;inset:0;background:#000b;display:grid;place-items:center;padding:14px}.hidden{display:none}.modal{width:min(570px,96vw);max-height:92vh;overflow:auto;background:linear-gradient(#fff4ce,#d8bc7a);border:5px solid #19140f;padding:16px}.modal h1,.modal h2{text-align:center;margin:0 0 10px}.form{display:grid;gap:7px}.form input,.form select{padding:10px;border:2px solid #665339;background:#fffdf2}.card{text-align:center;padding:18px;background:#fff7d7;border:5px double #3a2c1d}.emoji{font-size:66px}.find{font-size:28px;font-weight:900}.log{height:145px;overflow:auto;background:#181511;color:#f4e8c8;padding:7px;font:11px/1.4 monospace}.legend{position:absolute;z-index:4;right:3%;bottom:2%;background:#f9ebbbe8;border:2px solid #2d241a;padding:5px 7px;font:11px Arial}.place{position:absolute;z-index:2;border:2px solid #3e3325;background:#e8d39bba;border-radius:50%;filter:blur(.2px)}
@media(max-width:820px){.top .tag{display:none}.side{border-width:0 0 3px 0}.panel{margin-bottom:5px}.panel.playersPanel,.panel.logPanel{display:none}.board{border-width:0}.grid{gap:0}.row button{flex:1;min-width:95px}}
</style>
</head>
<body>
<div class="app"><header class="top"><div><div class="logo">LÄHIÖN AARRE</div><div class="tag">Stigun kätkö odottaa löytäjäänsä.</div></div><button id="newBtn">Uusi peli</button></header><div class="grid"><main class="board" id="board"><div class="mapTitle">LÄHIÖN AARRE</div><div class="place" style="left:10%;top:18%;width:25%;height:9%"></div><div class="place" style="left:60%;top:34%;width:31%;height:10%"></div><div class="place" style="left:20%;top:55%;width:28%;height:12%"></div><svg id="map" viewBox="0 0 1000 1420"></svg><div class="legend">🔴 kätkö &nbsp; 🚌 bussipysäkki &nbsp; 🟡 Stigun metsä</div></main><aside class="side"><section class="panel"><div style="font:11px Arial">VUOROSSA</div><div class="turn" id="turn">–</div><div class="status" id="status">Aloita peli.</div><div class="dice" id="dice">–</div><div class="row"><button id="roll">🎲 Heitä</button><button id="stop">⏹ Lopeta</button><button class="green" id="search">🔎 Tutki</button></div></section><section class="panel"><div class="row"><button id="sell">💶 Myy</button><button class="blue" id="bus">🚌 Bussi</button><button class="blue" id="freebus">🎫 Pummilla</button></div></section><section class="panel playersPanel"><b>Pelaajat</b><div class="players" id="players"></div></section><section class="panel logPanel"><b>Tapahtumat</b><div class="log" id="log"></div></section></aside></div></div>
<div class="modalWrap" id="start"><div class="modal"><h1>LÄHIÖN AARRE</h1><p>Etsi kätköjä, löydä <b>Stigun avain</b>, hae metsäkätkön aarre ja palaa omaan kotipesääsi.</p><div class="form"><select id="count"><option value="2">2 pelaajaa</option><option value="3">3 pelaajaa</option><option value="4" selected>4 pelaajaa</option></select><div id="names" class="form"></div><button id="startBtn">Aloita peli</button></div></div></div>
<div class="modalWrap hidden" id="event"><div class="modal"><div id="eventBody"></div><div class="row" style="justify-content:center" id="eventButtons"></div></div></div>
<div class="modalWrap hidden" id="busModal"><div class="modal"><h2>🚌 Valitse pysäkki</h2><div class="row" id="busChoices"></div><div class="row"><button id="cancelBus">Peruuta</button></div></div></div>
<script>
const C=['#f2c51e','#2770d2','#db3b38','#329058'],H=['A-talo','B-talo','C-talo','D-talo'];
const N=[
{id:'A',x:115,y:340,n:'A-talo',home:0},{id:'a1',x:210,y:310},{id:'s1',x:315,y:285,s:1},{id:'north',x:470,y:205,n:'Bussipysäkki Pohjoinen',bus:1},{id:'s2',x:620,y:155,s:1},{id:'s3',x:760,y:210,s:1},{id:'goal',x:880,y:155,n:'Stigun metsäkätkö',goal:1},
{id:'west',x:95,y:625,n:'Bussipysäkki Länsi',bus:1},{id:'s4',x:235,y:580,s:1},{id:'park',x:340,y:490,n:'Koirapuisto'},{id:'s5',x:430,y:595,s:1},{id:'ostari',x:505,y:700,n:'OSTARI'},{id:'s6',x:620,y:595,s:1},{id:'grilli',x:705,y:675,n:'Grillikioski'},{id:'s7',x:805,y:585,s:1},{id:'east',x:915,y:625,n:'Bussipysäkki Itä',bus:1},
{id:'police',x:250,y:825,n:'Poliisilaitos'},{id:'s8',x:390,y:805,s:1},{id:'bar',x:505,y:900,n:'Lähiöbaari'},{id:'s9',x:635,y:815,s:1},{id:'gas',x:755,y:895,n:'Huoltoasema'},{id:'s10',x:865,y:820,s:1},
{id:'B',x:105,y:1200,n:'B-talo',home:1},{id:'skate',x:245,y:1055,n:'Skeittiparkki'},{id:'s11',x:360,y:1030,s:1},{id:'south',x:500,y:1190,n:'Bussipysäkki Etelä',bus:1},{id:'s12',x:640,y:1030,s:1},{id:'cellar',x:770,y:1070,n:'Kerrostalon kellari'},{id:'C',x:880,y:1200,n:'C-talo',home:2},{id:'D',x:900,y:990,n:'D-talo',home:3}];
const E=[['A','a1'],['a1','s1'],['s1','north'],['north','s2'],['s2','s3'],['s3','goal'],['A','west'],['west','s4'],['s4','park'],['park','s5'],['s5','ostari'],['s1','park'],['north','s5'],['ostari','s6'],['s6','grilli'],['grilli','s7'],['s7','east'],['s6','s3'],['s7','s3'],['west','police'],['police','s8'],['s8','ostari'],['ostari','s9'],['s9','gas'],['gas','s10'],['s10','east'],['ostari','bar'],['bar','s8'],['bar','s9'],['police','B'],['B','skate'],['skate','s11'],['s11','south'],['bar','south'],['south','s12'],['s12','cellar'],['cellar','C'],['cellar','D'],['gas','cellar'],['east','D']];
const M=Object.fromEntries(N.map(x=>[x.id,x])),A={};N.forEach(x=>A[x.id]=[]);E.forEach(([a,b])=>{A[a].push(b);A[b].push(a)});const ST=N.filter(x=>x.s).map(x=>x.id),BUS=['north','east','south','west'];
const DECK=[{t:'key',n:'Stigun avain',e:'🗝️',d:'Avain sopii metsäkätköön.'},{t:'peukku',n:'Peukku',e:'👍',v:500,d:'Arvo Ostarilla 500 €.'},{t:'peukku',n:'Peukku',e:'👍',v:500,d:'Arvo Ostarilla 500 €.'},{t:'budi',n:'Budi',e:'🌿',v:200,d:'Arvo Ostarilla 200 €.'},{t:'budi',n:'Budi',e:'🌿',v:200,d:'Arvo Ostarilla 200 €.'},{t:'cash',n:'Käteisnyytti',e:'💶',v:300,d:'Arvo Ostarilla 300 €.'},{t:'phone',n:'Pöllitty luuri',e:'📱',v:150,d:'Arvo Ostarilla 150 €.'},{t:'jopo',n:'Jopo',e:'🚲',d:'+1 kaikkiin liikkumisheittoihin.'},{t:'bottles',n:'Panttikassi',e:'♻️',v:50,d:'Arvo Ostarilla 50 €.'},{t:'police',n:'Partio',e:'🚔',d:'Poliisilaitokselle ja seuraava vuoro väliin.'},{t:'empty',n:'Tyhjä jemma',e:'🕳️',d:'Ei mitään.'},{t:'empty',n:'Tyhjä jemma',e:'🕳️',d:'Ei mitään.'}];
let S=null;const $=x=>document.getElementById(x),svg=$('map');function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function el(n,a={}){let x=document.createElementNS('http://www.w3.org/2000/svg',n);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));return x}
function draw(){svg.innerHTML='';E.forEach(([a,b])=>{let x=M[a],y=M[b],l=el('line',{x1:x.x,y1:x.y,x2:y.x,y2:y.y,class:'road'});svg.appendChild(l)});[['north','east'],['east','south'],['south','west'],['west','north']].forEach(([a,b])=>{let x=M[a],y=M[b],l=el('line',{x1:x.x,y1:x.y,x2:y.x,y2:y.y,class:'road bus'});svg.appendChild(l)});N.forEach(n=>{let g=el('g',{class:'node '+(n.s?'stash ':'')+(n.bus?'bus ':'')+(n.home!==undefined?'home ':'')+(n.goal?'goal ':''),'data-id':n.id});let c=el('circle',{cx:n.x,cy:n.y,r:n.home!==undefined?24:(n.s?19:16)});if(n.home!==undefined)c.setAttribute('stroke',C[n.home]);g.appendChild(c);if(n.s){let q=el('text',{x:n.x,y:n.y,class:'stashQ'});q.textContent='?';g.appendChild(q)}if(n.n){let t=el('text',{x:n.x,y:n.y+38,'text-anchor':'middle',class:'label '+(n.bus?'minor':'')});t.textContent=n.n;g.appendChild(t)}g.onclick=()=>move(n.id);svg.appendChild(g)});tokens()}
function tokens(){svg.querySelectorAll('.pawn').forEach(x=>x.remove());svg.querySelectorAll('.node').forEach(x=>x.classList.remove('legal'));if(!S)return;let p=P();if(S.phase==='move')A[p.pos].forEach(id=>svg.querySelector(`[data-id="${id}"]`).classList.add('legal'));S.players.forEach((p,i)=>{let n=M[p.pos],c=el('circle',{cx:n.x+(i%2?9:-9),cy:n.y+(i<2?-9:9),r:13,fill:p.c,class:'pawn '+(i===S.turn?'now':'')});svg.appendChild(c);if(p.treasure){let t=el('text',{x:n.x+20,y:n.y-22,class:'label minor'});t.textContent='💰';svg.appendChild(t)}})}
function names(){let c=+$('count').value;$('names').innerHTML='';for(let i=0;i<c;i++){let x=document.createElement('input');x.id='nm'+i;x.value='Pelaaja '+(i+1);$('names').appendChild(x)}}$('count').onchange=names;names();
function log(t){let d=document.createElement('div');d.textContent=t;$('log').appendChild(d);$('log').scrollTop=99999}function P(){return S.players[S.turn]}
function start(){let c=+$('count').value,d=sh(DECK);while(d.length<ST.length)d.push({t:'empty',n:'Tyhjä jemma',e:'🕳️',d:'Ei mitään.'});d=sh(d).slice(0,ST.length);if(!d.some(x=>x.t==='key'))d[0]=DECK[0];let st={};ST.forEach((id,i)=>st[id]={...d[i],o:false});S={turn:0,phase:'roll',moves:0,roll:0,st,treasureTaken:false,over:false,players:Array.from({length:c},(_,i)=>({name:$('nm'+i).value,c:C[i],home:['A','B','C','D'][i],homeName:H[i],pos:['A','B','C','D'][i],money:300,items:[],key:false,jopo:false,treasure:false,skip:0}))};$('start').classList.add('hidden');$('log').innerHTML='';log('Peli alkaa. Stigun avain on yhdessä kätkössä.');begin();render()}
function begin(){if(S.over)return;let p=P();if(p.skip){p.skip--;log(p.name+' selvittelee asioita poliisilaitoksella.');next();return}S.phase='roll';S.moves=0;S.roll=0;log('— '+p.name+' —');render()}function next(){if(S.over)return;S.turn=(S.turn+1)%S.players.length;setTimeout(begin,120)}
function roll(){if(S.phase!=='roll')return;let r=1+Math.floor(Math.random()*6)+(P().jopo?1:0);S.roll=r;S.moves=r;S.phase='move';log(P().name+' heitti '+r+'.');render()}
function move(id){if(!S||S.phase!=='move'||S.moves<1||!A[P().pos].includes(id))return;P().pos=id;S.moves--;place();if(S.phase==='move'&&S.moves===0)S.phase='action';render()}
function place(){let p=P();if(p.treasure&&p.pos===p.home){S.over=true;show(`<div class="card"><div class="emoji">🏆</div><div class="find">${p.name} voitti!</div><p>Stigun aarre pääsi ${p.homeName}-kotipesään.</p></div>`,true);return}if(p.pos==='goal'&&p.key&&!S.treasureTaken){p.key=false;p.treasure=true;S.treasureTaken=true;S.phase='action';show(`<div class="card"><div class="emoji">🌲💰</div><div class="find">STIGUN METSÄKÄTKÖ</div><p>Aarre löytyi. Nyt takaisin kotipesään!</p></div>`);log(p.name+' sai Stigun aarteen.');return}let oi=S.players.findIndex((q,i)=>i!==S.turn&&q.pos===p.pos&&q.treasure);if(oi>=0)duel(oi,S.turn);else if(p.treasure){let ci=S.players.findIndex((q,i)=>i!==S.turn&&q.pos===p.pos);if(ci>=0)duel(S.turn,ci)}}
function duel(o,c){let a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6),O=S.players[o],C2=S.players[c];if(b>a){O.treasure=false;C2.treasure=true;show(`<div class="card"><div class="emoji">⚡</div><div class="find">${C2.name} nappasi aarteen!</div><p>${O.name} ${a} – ${b} ${C2.name}</p></div>`)}else show(`<div class="card"><div class="emoji">⚡</div><div class="find">${O.name} piti aarteen</div><p>${O.name} ${a} – ${b} ${C2.name}</p></div>`)}
function stop(){if(S.phase==='move'){S.moves=0;S.phase='action';place();render()}else if(S.phase==='action')next()}
function inspect(){if(!S||!['move','action'].includes(S.phase))return;let s=S.st[P().pos];if(!s||s.o){show('<h2>Ei avaamatonta kätköä tässä.</h2>');return}S.phase='action';if(P().money>=100)show('<h2>🔎 Kätköpaikka</h2><p style="text-align:center">Maksa 100 € tai kokeile ilmaiseksi.</p>',false,[['Maksa 100 €',()=>{P().money-=100;openStash()}],['Dyykkaa',free]]);else free()}
function free(){close();let r=1+Math.floor(Math.random()*6);if(r>=4)openStash();else show(`<div class="card"><div class="emoji">🗑️</div><div class="find">Ei osunut</div><p>Heitit ${r}. Tarvitaan 4–6.</p></div>`)}
function openStash(){close();let p=P(),s=S.st[p.pos];s.o=true;if(s.t==='key')p.key=true;else if(s.t==='jopo')p.jopo=true;else if(s.t==='police'){p.pos='police';p.skip=1}else if(s.v)p.items.push({n:s.n,v:s.v,e:s.e});log(p.name+' löysi: '+s.n+'.');show(`<div class="card"><div class="emoji">${s.e}</div><div class="find">${s.n}</div><p>${s.d}</p></div>`);render()}
function sell(){let p=P();if(p.pos!=='ostari'){show('<h2>Myynti onnistuu vain Ostarilla.</h2>');return}let t=p.items.reduce((a,x)=>a+x.v,0);if(!t){show('<h2>Ei myytävää.</h2>');return}p.money+=t;p.items=[];show(`<div class="card"><div class="emoji">💶</div><div class="find">+${t} €</div></div>`);render()}
function bus(freeRide){let p=P();if(!M[p.pos].bus){show('<h2>Sinun pitää olla bussipysäkillä.</h2>');return}if(!freeRide&&p.money<100){show('<h2>Ei 100 € bussirahaa.</h2>');return}if(freeRide&&1+Math.floor(Math.random()*6)===1){p.pos='police';p.skip=1;S.phase='action';show('<div class="card"><div class="emoji">🚔</div><div class="find">Tarkastaja!</div><p>Poliisilaitokselle.</p></div>');render();return}if(!freeRide)p.money-=100;$('busChoices').innerHTML='';BUS.filter(x=>x!==p.pos).forEach(id=>{let b=document.createElement('button');b.textContent=M[id].n;b.onclick=()=>{p.pos=id;S.phase='action';$('busModal').classList.add('hidden');render()};$('busChoices').appendChild(b)});$('busModal').classList.remove('hidden')}
function show(html,win=false,actions=null){$('eventBody').innerHTML=html;$('eventButtons').innerHTML='';if(actions)actions.forEach(([t,f])=>{let b=document.createElement('button');b.textContent=t;b.onclick=f;$('eventButtons').appendChild(b)});else if(!win){let b=document.createElement('button');b.textContent='Jatka';b.onclick=close;$('eventButtons').appendChild(b)}$('event').classList.remove('hidden')}function close(){$('event').classList.add('hidden')}
function render(){if(!S)return;let p=P();$('turn').textContent=p.name;$('dice').textContent=S.roll||'–';$('status').textContent=S.over?'Peli päättyi.':S.phase==='roll'?'Heitä noppaa.':S.phase==='move'?'Liikkeitä jäljellä '+S.moves+'. Napauta hohtavaa ruutua.':'Tutki paikka tai lopeta vuoro.';$('roll').disabled=S.phase!=='roll'||S.over;$('stop').disabled=!['move','action'].includes(S.phase)||S.over;$('players').innerHTML='';S.players.forEach((q,i)=>{let v=q.items.reduce((a,x)=>a+x.v,0),d=document.createElement('div');d.className='player '+(i===S.turn?'now':'');d.innerHTML=`<span class="dot" style="background:${q.c}"></span><div><b>${q.name}</b><br>${M[q.pos].n||'Reitillä'}<br>${q.key?'<span class="badge">🗝️ Avain</span> ':''}${q.jopo?'<span class="badge">🚲 Jopo</span> ':''}${q.treasure?'<span class="badge">💰 Aarre</span> ':''}</div><div><b>${q.money} €</b><br>löydöt ${v} €</div>`;$('players').appendChild(d)});tokens()}
$('startBtn').onclick=start;$('roll').onclick=roll;$('stop').onclick=stop;$('search').onclick=inspect;$('sell').onclick=sell;$('bus').onclick=()=>bus(false);$('freebus').onclick=()=>bus(true);$('cancelBus').onclick=()=>$('busModal').classList.add('hidden');$('newBtn').onclick=()=>{$('start').classList.remove('hidden');names()};draw();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
