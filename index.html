<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17130f">
<title>Lähiön Aarre</title>
<style>html,body{margin:0;width:100%;height:100%;background:#17130f;color:#f7e8b8;font-family:Georgia,serif;display:grid;place-items:center}main{text-align:center;padding:24px}h1{font-size:34px;margin:0 0 12px}.spin{font-size:34px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{font:14px Arial}</style>
</head>
<body><main><h1>LÄHIÖN AARRE</h1><div class="spin">◎</div><p>Ladataan pelilautaa…</p></main>
<script>
(async()=>{try{const files=['./assets/app-1.txt','./assets/app-2.txt','./assets/app-3.txt','./assets/app-4.txt'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.querySelector('p').textContent='Pelin lataus epäonnistui. Päivitä sivu.';console.error(e)}})();
</script></body></html>
